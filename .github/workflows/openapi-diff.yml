name: OpenAPI Diff
on: [pull_request]
jobs:
  openapi-diff:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout HEAD
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.head_ref }}
          path: head
          persist-credentials: false
      - name: Checkout BASE
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.base_ref }}
          path: base
          persist-credentials: false
      - name: Generate oasdiff summary
        id: oasdif_changelog
        run: |
          SUMMARY=$(docker run --rm \
            --workdir ${{ github.workspace }} \
            --volume ${{ github.workspace }}:${{ github.workspace }}:rw \
            -e GITHUB_WORKSPACE=${{ github.workspace }} \
            tufin/oasdiff changelog --composed --flatten-allof \
            'base/openapi/specs/*.yaml' \
            'head/openapi/specs/*.yaml' \
            | head -1)
          echo "summary=$SUMMARY" >> $GITHUB_OUTPUT
          {
            echo "## OpenAPI Changes"
            echo ""
            echo "${SUMMARY:-No detectable change.}"
            echo ""
            echo "[View full changelog](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo ""
            echo "Unexpected changes? Ensure your branch is up-to-date with \`main\` (consider rebasing)."
          } > comment_body.md
      - name: Find existing comment
        id: find_comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          issue-number: ${{ github.event.pull_request.number }}
          body-includes: "## OpenAPI Changes"
      - name: Post changes as comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        # Even if no changes, make sure to update old comment if it was found.
        if: steps.oasdif_changelog.outputs.summary || steps.find_comment.outputs.comment-id
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          edit-mode: "replace"
          repository: ${{ github.repository }}
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find_comment.outputs.comment-id }}
          body-path: comment_body.md
      - name: Check for breaking changes
        id: oasdif_breaking
        run: |
          docker run --rm \
            --workdir ${{ github.workspace }} \
            --volume ${{ github.workspace }}:${{ github.workspace }}:ro \
            -e GITHUB_WORKSPACE=${{ github.workspace }} \
            tufin/oasdiff breaking \
            --err-ignore head/openapi/oasdiff-err-ignore.txt \
            --fail-on ERR \
            --format githubactions \
            --composed --flatten-allof \
            'base/openapi/specs/*.yaml' \
            'head/openapi/specs/*.yaml'

  # ONE required status check standing for this whole workflow, the same device as
  # `ci-gate` in ci.yml and for the same reason: the ruleset that requires it lives in
  # mitodl/ol-infrastructure, and GitHub's required status checks take an exact list of
  # context names. A job renamed here would keep being required under its old name,
  # which GitHub never reports again, so every PR waits forever on it.
  #
  # `ci-gate` cannot absorb this one: `needs` only reaches jobs in the same workflow
  # file, and this workflow triggers on `pull_request` rather than `push`. So the two
  # gates are required side by side.
  openapi-diff-gate:
    needs:
      - openapi-diff
    # Without this the gate is skipped when a dependency fails, and a skipped required
    # check leaves the PR pending rather than failing it.
    if: always()
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Evaluate OpenAPI diff result
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # Read from `needs` rather than naming each job again: adding a job to the
          # list above is then the only edit, which is the entire point of this job.
          # `skipped` passes so that a job legitimately gated behind an `if:` does not
          # wedge the branch; `failure` and `cancelled` do not.
          failed=$(echo "$NEEDS" | jq -r '
            to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | .key')
          if [ -n "$failed" ]; then
            echo "::error::OpenAPI diff did not succeed: $(echo "$failed" | paste -sd, -)"
            exit 1
          fi
          echo "OpenAPI diff succeeded."
